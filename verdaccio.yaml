# Local npm registry for testing `oml publish` / `oml install` without touching npmjs.org.
# Start it with `node scripts/registry.mjs`. Paths are relative to this file; .verdaccio/ is git-ignored.
storage: ./.verdaccio/storage
auth:
  htpasswd:
    file: ./.verdaccio/htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  # Our own packages come only from this local registry (never fetched from npmjs.org),
  # so local testing can't silently pick up a public version.
  '@modelware/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
