# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@modelware/sierra-method"
  version: 1.0.2
  title: Sierra Method
  description: The Sierra modeling method

# source folders
sources:
  - src

# oml server settings
#server:
#  port: 8080

# packing settings
pack:
  - include: [src/method]

# oml-cli parameter defaults
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  render: -m src/model/md -b build/web -c src/model/oml/waterline.project/waterline-construction/description-bundle.oml
  pack: -o build/dist
